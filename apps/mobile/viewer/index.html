<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />
    <title>ShirNote</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f6f4ef;
        color: #1c1b19;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      #scroll {
        position: fixed;
        inset: 0;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }

      #stage {
        padding: 12px;
      }

      #score {
        min-height: 240px;
        padding: 12px;
        background: #ffffff;
        border: 1px solid #ddd8ce;
        border-radius: 12px;
        box-shadow:
          0 1px 2px rgb(28 27 25 / 8%),
          0 8px 24px rgb(28 27 25 / 6%);
      }

      #score svg {
        max-width: none;
      }
    </style>
  </head>
  <body>
    <div id="scroll">
      <div id="stage">
        <div id="score" role="img" aria-label="Partitura"></div>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
